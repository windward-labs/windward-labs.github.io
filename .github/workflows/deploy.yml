name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install and Build
        uses: withastro/action@v3
        env:
          PUBLIC_PRIVY_APP_ID: ${{ vars.PUBLIC_PRIVY_APP_ID }}
          PUBLIC_PRIVY_CLIENT_ID: ${{ vars.PUBLIC_PRIVY_CLIENT_ID }}
          PUBLIC_SERVICE_API_URL: ${{ vars.PUBLIC_SERVICE_API_URL }}
      - name: Validate portal
        run: |
          npm run typecheck
          npm test
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
